<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" style="background-color: white;">
  <defs>
    <!-- Gradient Background -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c4a6e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main Card Background -->
  <rect width="300" height="420" fill="url(#cardGradient)" rx="15" ry="15" />

  <!-- Suits in Corners with Precise Positioning -->
  <text x="25" y="70" font-size="40" fill="#0c4a6e" opacity="0.5" 
        font-family="Arial, sans-serif" text-anchor="middle">♥</text>
  <text x="275" y="70" font-size="40" fill="#0c4a6e" opacity="0.5" 
        font-family="Arial, sans-serif" text-anchor="middle">♦</text>
  <text x="25" y="370" font-size="40" fill="#0c4a6e" opacity="0.5" 
        font-family="Arial, sans-serif" text-anchor="middle">♣</text>
  <text x="275" y="370" font-size="40" fill="#0c4a6e" opacity="0.5" 
        font-family="Arial, sans-serif" text-anchor="middle">♠</text>

  <!-- Game Title -->
  <text x="150" y="200" 
        text-anchor="middle" 
        font-family="Arial Black, sans-serif" 
        font-size="40" 
        font-weight="900" 
        fill="#ffffff"
        style="text-shadow: 3px 3px 5px rgba(0,0,0,0.3);">
    BEAT THE
  </text>
  <text x="150" y="250" 
        text-anchor="middle" 
        font-family="Arial Black, sans-serif" 
        font-size="55" 
        font-weight="900" 
        fill="#ffffff"
        style="text-shadow: 3px 3px 5px rgba(0,0,0,0.3);">
    DECK
  </text>

  <!-- Subtle Card Texture -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="2">
    <path d="M0 50 L300 0" />
    <path d="M0 150 L300 100" />
    <path d="M0 250 L300 200" />
    <path d="M0 350 L300 300" />
  </g>
</svg>
